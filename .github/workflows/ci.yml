name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }} / ${{ matrix.compiler }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            compiler: mingw
            build_cmd: |
              $ErrorActionPreference = "Stop"
              New-Item -ItemType Directory -Force -Path build-ci | Out-Null
              $sources = Get-ChildItem -Path src -Recurse -Filter *.cpp | ForEach-Object { $_.FullName }
              if ($sources.Count -eq 0) { throw "No .cpp files found in src/" }
              Write-Host "Compiling $($sources.Count) .cpp files..."
              & g++ -std=c++23 -O2 -DNDEBUG -static -static-libgcc -static-libstdc++ `
                    $sources -o build-ci/pmake.exe `
                    -lmpr -luserenv -lkernel32 -luser32 -lgdi32 -lwinspool `
                    -lshell32 -lole32 -loleaut32 -luuid -lcomdlg32 -ladvapi32
              if ($LASTEXITCODE -ne 0) { throw "g++ failed with exit code $LASTEXITCODE" }
              if (-not (Test-Path "build-ci/pmake.exe")) { throw "pmake.exe not produced" }
            pmake_exe: build-ci/pmake.exe

          - os: ubuntu-latest
            compiler: gcc
            build_cmd: |
              set -e
              mkdir -p build-ci
              g++ -std=c++23 -O2 -DNDEBUG \
                  $(find src -name '*.cpp' | sort) \
                  -o build-ci/pmake -pthread
              test -x build-ci/pmake
            pmake_exe: build-ci/pmake

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup MinGW (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'mingw'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            mingw-w64-x86_64-gcc

      - name: Add MinGW to PATH (Windows)
        if: runner.os == 'Windows' && matrix.compiler == 'mingw'
        shell: pwsh
        run: |
          $mingw = "C:\msys64\mingw64\bin"
          if (-not (Test-Path "$mingw\g++.exe")) { throw "g++ not found at $mingw" }
          echo $mingw | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

      - name: Build pmake
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: ${{ matrix.build_cmd }}

      - name: Verify pmake version
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          ${{ matrix.pmake_exe }} -V

      - name: Generate test project
        working-directory: tests
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: python run.py --generate-only

      - name: Run test suite
        working-directory: tests
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          $exePath = (Resolve-Path "../${{ matrix.pmake_exe }}").Path 2>$null || (cd .. && realpath "${{ matrix.pmake_exe }}")
          $ErrorActionPreference = "Continue"
          python run.py --pmake "$exePath"
        continue-on-error: false

      - name: Check for regressions
        if: always()
        working-directory: tests
        shell: ${{ runner.os == 'Windows' && 'pwsh' || 'bash' }}
        run: |
          if (-not (Test-Path "results/report.json")) {
            throw "report.json not produced"
          }
          $report = Get-Content results/report.json | ConvertFrom-Json
          Write-Host "PASS: $($report.passed) / $($report.total)"
          Write-Host "REGRESSIONS: $($report.regressions)"
          Write-Host "KNOWN BUGS: $($report.known_bugs)"
          if ($report.regressions -gt 0) {
            throw "REGRESSIONS FOUND: $($report.regressions)"
          }

      - name: Upload test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ matrix.os }}-${{ matrix.compiler }}
          path: |
            tests/results/report.json
            tests/results/*.log
          retention-days: 30

      - name: Upload pmake binary
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: pmake-${{ matrix.os }}-${{ matrix.compiler }}
          path: ${{ matrix.pmake_exe }}
          retention-days: 7