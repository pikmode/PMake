name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
          - os: ubuntu-latest

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # --- WINDOWS BUILD ---
      - name: Setup MSYS2 (Windows)
        if: runner.os == 'Windows'
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: mingw-w64-x86_64-gcc

      - name: Build pmake (Windows)
        if: runner.os == 'Windows'
        shell: msys2 {0}
        run: |
          mkdir -p build-ci
          g++ -std=c++23 -O2 -DNDEBUG -static -static-libgcc -static-libstdc++ -I src \
              src/main.cpp src/core/*.cpp src/parser/*.cpp src/parser/ninja-parser/*.cpp \
              src/executor/*.cpp src/deps/*.cpp src/util/*.cpp src/ui/*.cpp \
              -o build-ci/pmake.exe \
              -lmpr -luserenv -lkernel32 -luser32 -lgdi32 -lwinspool \
              -lshell32 -lole32 -loleaut32 -luuid -lcomdlg32 -ladvapi32

      # --- LINUX BUILD ---
      - name: Build pmake (Linux)
        if: runner.os == 'Linux'
        run: |
          mkdir -p build-ci
          g++ -std=c++23 -O2 -DNDEBUG -I src $(find src -name '*.cpp' | sort) -o build-ci/pmake -pthread

      # --- TESTS (WINDOWS ONLY) ---
      - name: Run tests (Windows)
        if: runner.os == 'Windows'
        working-directory: tests-pmake-1.0
        run: |
          python run.py --generate-only
          python run.py --pmake ../build-ci/pmake.exe

      - name: Check regressions (Windows)
        if: runner.os == 'Windows'
        working-directory: tests-pmake-1.0
        run: python ../scripts/check_report.py